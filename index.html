<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>さとのわ 人数カウンター TEST</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --panel2:#1f2937; --text:#f8fafc;
      --muted:#94a3b8; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; --accent:#38bdf8;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
    .wrap{max-width:900px;margin:auto;padding:12px}
    h1{font-size:20px;margin:4px 0 10px}
    .badge{font-size:12px;background:#334155;padding:3px 8px;border-radius:999px;color:#e2e8f0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
    .card{background:var(--panel);padding:12px;border-radius:14px;text-align:center}
    .label{font-size:12px;color:var(--muted)}
    .num{font-size:34px;font-weight:800;line-height:1.1;margin-top:4px}
    .camera{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3}
    video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .line{position:absolute;left:0;right:0;top:55%;height:3px;background:#f59e0b;box-shadow:0 0 0 1px #0008}
    .line::after{content:"判定ライン";position:absolute;right:6px;top:-24px;background:#000a;color:#fff;padding:2px 6px;border-radius:6px;font-size:11px}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    button,select,input{font:inherit}
    button{border:0;border-radius:12px;padding:13px 10px;font-weight:700}
    .primary{background:var(--good);color:#052e16}
    .secondary{background:#334155;color:#fff}
    .warn{background:var(--warn);color:#3b2200}
    .danger{background:var(--bad);color:white}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .settings{background:var(--panel);border-radius:14px;padding:12px;margin-top:10px}
    .settings label{display:block;margin:8px 0;color:#cbd5e1;font-size:14px}
    input[type=range]{width:100%}
    .status{font-size:13px;color:#cbd5e1;margin:10px 0 0}
    .log{background:var(--panel);border-radius:14px;margin-top:10px;padding:12px}
    .log h2{font-size:15px;margin:0 0 8px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{border-bottom:1px solid #334155;padding:7px;text-align:left}
    .tiny{font-size:12px;color:var(--muted);line-height:1.5}
    .notice{background:#172554;border:1px solid #1d4ed8;color:#dbeafe;padding:10px;border-radius:12px;margin-top:10px;font-size:13px}
    @media(max-width:560px){.num{font-size:28px}.wrap{padding:8px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>さとのわ 人数カウンター <span class="badge">TEST</span></h1>

  <div class="grid">
    <div class="card"><div class="label">入場</div><div id="inCount" class="num">0</div></div>
    <div class="card"><div class="label">退出</div><div id="outCount" class="num">0</div></div>
    <div class="card"><div class="label">現在推定</div><div id="insideCount" class="num">0</div></div>
  </div>

  <div class="camera">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="judgeLine" class="line"></div>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary">カメラ開始</button>
    <button id="stopBtn" class="secondary">停止</button>
    <button id="plusBtn" class="secondary">＋1 手動補正</button>
    <button id="minusBtn" class="secondary">－1 手動補正</button>
  </div>

  <div class="settings">
    <label>判定ライン位置：<span id="lineLabel">55</span>%</label>
    <input id="lineRange" type="range" min="20" max="80" value="55">

    <label>入場方向</label>
    <select id="direction">
      <option value="down">上 → 下 が入場</option>
      <option value="up">下 → 上 が入場</option>
    </select>

    <label>AI信頼度：<span id="scoreLabel">55</span>%</label>
    <input id="scoreRange" type="range" min="30" max="90" value="55">

    <div id="status" class="status">準備中：AIモデルを読み込みます。</div>
  </div>

  <div class="row">
    <button id="csvBtn" class="secondary">CSV保存</button>
    <button id="resetBtn" class="danger">今日の記録をリセット</button>
  </div>

  <div class="notice">
    このテスト版は顔認識をしません。映像・顔画像は保存せず、端末上で人物検出して「通過時刻」と人数だけを保存します。
  </div>

  <div class="log">
    <h2>最近の通過記録</h2>
    <table>
      <thead><tr><th>時刻</th><th>方向</th><th>累計</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

  <p class="tiny">
    ※ カメラはHTTPS（GitHub Pagesなど）で開く必要があります。<br>
    ※ 混雑・すれ違い・子どもが大人の陰に隠れる場合は誤差が出ます。まずは実人数と比較して精度を確認してください。
  </p>
</div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const plusBtn = document.getElementById('plusBtn');
  const minusBtn = document.getElementById('minusBtn');
  const resetBtn = document.getElementById('resetBtn');
  const csvBtn = document.getElementById('csvBtn');
  const lineRange = document.getElementById('lineRange');
  const lineLabel = document.getElementById('lineLabel');
  const judgeLine = document.getElementById('judgeLine');
  const scoreRange = document.getElementById('scoreRange');
  const scoreLabel = document.getElementById('scoreLabel');
  const direction = document.getElementById('direction');
  const statusEl = document.getElementById('status');

  let model = null, stream = null, running = false;
  let counts = JSON.parse(localStorage.getItem('satonowa-counter-counts') || '{"in":0,"out":0}');
  let logs = JSON.parse(localStorage.getItem('satonowa-counter-logs') || '[]');
  let tracks = [];
  let nextId = 1;
  let lastDetect = 0;
  const DETECT_MS = 280;
  const TRACK_TTL = 1500;
  const MATCH_DISTANCE = 120;
  const COOLDOWN = 2500;

  function persist(){
    localStorage.setItem('satonowa-counter-counts', JSON.stringify(counts));
    localStorage.setItem('satonowa-counter-logs', JSON.stringify(logs.slice(-500)));
  }
  function render(){
    document.getElementById('inCount').textContent = counts.in;
    document.getElementById('outCount').textContent = counts.out;
    document.getElementById('insideCount').textContent = Math.max(0, counts.in - counts.out);
    const body = document.getElementById('logBody');
    body.innerHTML = logs.slice(-10).reverse().map(x =>
      `<tr><td>${x.time}</td><td>${x.type}</td><td>${x.total}</td></tr>`
    ).join('');
  }
  function addEvent(kind, manual=false){
    if(kind === 'in') counts.in++;
    else counts.out++;
    const now = new Date();
    logs.push({
      iso: now.toISOString(),
      time: now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
      type: (kind === 'in' ? '入場' : '退出') + (manual ? '（手動）' : ''),
      total: counts.in
    });
    persist(); render();
  }

  lineRange.addEventListener('input', () => {
    lineLabel.textContent = lineRange.value;
    judgeLine.style.top = lineRange.value + '%';
  });
  scoreRange.addEventListener('input', () => scoreLabel.textContent = scoreRange.value);

  plusBtn.onclick = () => addEvent('in', true);
  minusBtn.onclick = () => {
    if(counts.in > 0) counts.in--;
    const now = new Date();
    logs.push({
      iso: now.toISOString(),
      time: now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}),
      type: '入場－1（手動補正）',
      total: counts.in
    });
    persist(); render();
  };

  resetBtn.onclick = () => {
    if(!confirm('今日の人数と通過記録を0に戻しますか？')) return;
    counts = {in:0,out:0}; logs = []; tracks = [];
    persist(); render();
  };

  csvBtn.onclick = () => {
    const rows = [['日時','種別','入場累計'], ...logs.map(x => [x.iso,x.type,x.total])];
    const csv = '\ufeff' + rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `satonowa_counter_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  };

  async function loadModel(){
    if(model) return;
    statusEl.textContent = 'AIモデル読み込み中…';
    model = await cocoSsd.load({base:'lite_mobilenet_v2'});
    statusEl.textContent = 'AI準備完了。カメラ開始を押してください。';
  }

  async function start(){
    try{
      await loadModel();
      stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}},
        audio:false
      });
      video.srcObject = stream;
      await video.play();
      running = true;
      tracks = [];
      statusEl.textContent = 'カウント中。玄関を通ってテストしてください。';
      requestAnimationFrame(loop);
    }catch(e){
      console.error(e);
      statusEl.textContent = 'カメラを開始できません。HTTPS・カメラ許可を確認してください。';
      alert('カメラを開始できませんでした。\nHTTPSで開いているか、カメラ権限を確認してください。');
    }
  }

  function stop(){
    running = false;
    if(stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    statusEl.textContent = '停止しました。';
  }
  startBtn.onclick = start;
  stopBtn.onclick = stop;

  function distance(a,b){
    return Math.hypot(a.x-b.x, a.y-b.y);
  }

  function trackPeople(dets, now){
    const lineY = video.videoHeight * (Number(lineRange.value)/100);
    const used = new Set();

    for(const det of dets){
      const [x,y,w,h] = det.bbox;
      const c = {x:x+w/2, y:y+h/2};
      let best = null, bestD = Infinity;

      for(const tr of tracks){
        if(used.has(tr.id)) continue;
        const d = distance(c, tr.center);
        if(d < bestD && d < MATCH_DISTANCE){ best = tr; bestD = d; }
      }

      if(!best){
        best = {
          id:nextId++, center:c, prev:c, lastSeen:now, lastCross:0,
          bbox:det.bbox
        };
        tracks.push(best);
      } else {
        used.add(best.id);
        best.prev = best.center;
        best.center = c;
        best.bbox = det.bbox;
        best.lastSeen = now;
      }

      const prevSide = best.prev.y < lineY ? -1 : 1;
      const currSide = best.center.y < lineY ? -1 : 1;
      if(prevSide !== currSide && now - best.lastCross > COOLDOWN){
        const movingDown = best.center.y > best.prev.y;
        let kind;
        if(direction.value === 'down') kind = movingDown ? 'in' : 'out';
        else kind = movingDown ? 'out' : 'in';
        addEvent(kind);
        best.lastCross = now;
      }
    }

    tracks = tracks.filter(t => now - t.lastSeen < TRACK_TTL);
  }

  function draw(dets){
    if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.lineWidth = 3;
    ctx.font = '18px sans-serif';

    const lineY = canvas.height * (Number(lineRange.value)/100);
    ctx.strokeStyle = '#f59e0b';
    ctx.beginPath(); ctx.moveTo(0,lineY); ctx.lineTo(canvas.width,lineY); ctx.stroke();

    for(const det of dets){
      const [x,y,w,h] = det.bbox;
      ctx.strokeStyle = '#22c55e';
      ctx.strokeRect(x,y,w,h);
      ctx.fillStyle = '#22c55e';
      ctx.fillText(`人 ${Math.round(det.score*100)}%`, x+4, Math.max(20,y-6));
    }
  }

  async function loop(ts){
    if(!running) return;
    requestAnimationFrame(loop);
    if(!model || video.readyState < 2 || ts - lastDetect < DETECT_MS) return;
    lastDetect = ts;
    try{
      const preds = await model.detect(video, 20);
      const threshold = Number(scoreRange.value)/100;
      const people = preds.filter(p => p.class === 'person' && p.score >= threshold);
      draw(people);
      trackPeople(people, performance.now());
      statusEl.textContent = `カウント中：画面内 ${people.length}人検出`;
    }catch(e){
      console.error(e);
      statusEl.textContent = 'AI処理でエラーが発生しました。';
    }
  }

  render();
  loadModel().catch(e => {
    console.error(e);
    statusEl.textContent = 'AIモデルを読み込めません。ネット接続を確認してください。';
  });
})();
</script>
</body>
</html>
